<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" role="img" aria-label="Himalayan Food and Feed Logo">
  <defs>
    <style>
      .brand-title-w { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 26px; fill: #FFFFFF; letter-spacing: 0.04em; }
      .brand-sub-w { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11.5px; fill: #82B545; letter-spacing: 0.22em; }
    </style>
  </defs>
  <!-- Background disc for logo mark contrast on dark background -->
  <circle cx="38" cy="36" r="32" fill="#FFFFFF" opacity="0.96" />
  <!-- Embedded High-Definition Client Logo Mark -->
  <image href="logo-mark.png" x="4" y="5" width="68" height="62" preserveAspectRatio="xMidYMid meet" />
  <!-- Wordmark -->
  <text x="88" y="38" class="brand-title-w">HIMALAYAN</text>
  <text x="89" y="55" class="brand-sub-w">FOOD AND FEED</text>
  <!-- Small aesthetic accent dot -->
  <circle cx="330" cy="51" r="2.5" fill="#F2A10F" />
</svg>
